<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Nova — Doctor Portal</title>
    <link rel="stylesheet" href="doctor_style.css">
</head>
<body>

    <!-- Top bar -->
    <header class="dp_topbar">
        <button class="dp_brand" type="button" id="brandLogoBtn" aria-label="Back to login">
            <img src="care-nova-logo.png" alt="Care Nova">
            <span class="dp_portal_badge">Doctor Portal</span>
        </button>

        <div class="dp_summary_pill">
            <span class="dp_pulse" aria-hidden="true"></span>
            5 active prescriptions across 4 patients
        </div>

        <div class="dp_profile">
            <div class="dp_profile_text">
                <span class="dp_profile_name">Dr. Michael Torres</span>
                <span class="dp_profile_role">Cardiologist</span>
            </div>
            <div class="dp_avatar">MT</div>
            <button class="dp_logout" type="button" id="logoutBtn" aria-label="Log out">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Secondary navbar: back button + page links -->
    <nav class="dp_navbar" aria-label="Portal navigation">
        <button class="dp_back_btn" type="button" id="backBtn" aria-label="Go back">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back
        </button>

        <div class="dp_nav_links">
            <button class="dp_nav_link" type="button" data-page="Home">Home</button>
            <button class="dp_nav_link" type="button" data-page="Info">Info</button>
            <button class="dp_nav_link" type="button" data-page="Help">Help</button>
        </div>
    </nav>

    <div class="dp_layout">

        <!-- Sidebar: patient list -->
        <aside class="dp_sidebar" aria-label="Patient list">
            <label class="dp_search">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="patientSearchInput" placeholder="Search by name or MRN…">
            </label>

            <p class="dp_patient_count" id="patientCount">4 patients</p>

            <ul class="dp_patient_list" id="patientList">
                <li>
                    <button class="dp_patient_item is_active" type="button" data-patient-id="sarah-chen">
                        <span class="dp_patient_avatar">SC</span>
                        <span class="dp_patient_info">
                            <span class="dp_patient_name">Sarah Chen</span>
                            <span class="dp_patient_mrn">MRN-004821</span>
                        </span>
                        <span class="dp_patient_badge">2</span>
                    </button>
                </li>
                <li>
                    <button class="dp_patient_item" type="button" data-patient-id="marcus-williams">
                        <span class="dp_patient_avatar">MW</span>
                        <span class="dp_patient_info">
                            <span class="dp_patient_name">Marcus Williams</span>
                            <span class="dp_patient_mrn">MRN-003142</span>
                        </span>
                        <span class="dp_patient_badge">1</span>
                    </button>
                </li>
                <li>
                    <button class="dp_patient_item" type="button" data-patient-id="elena-rossi">
                        <span class="dp_patient_avatar">ER</span>
                        <span class="dp_patient_info">
                            <span class="dp_patient_name">Elena Rossi</span>
                            <span class="dp_patient_mrn">MRN-007563</span>
                        </span>
                        <span class="dp_patient_badge">1</span>
                    </button>
                </li>
                <li>
                    <button class="dp_patient_item" type="button" data-patient-id="james-okafor">
                        <span class="dp_patient_avatar">JO</span>
                        <span class="dp_patient_info">
                            <span class="dp_patient_name">James Okafor</span>
                            <span class="dp_patient_mrn">MRN-001987</span>
                        </span>
                        <span class="dp_patient_badge">1</span>
                    </button>
                </li>
            </ul>
        </aside>

        <!-- Main panel -->
        <main class="dp_main">

            <section class="dp_patient_card">
                <div class="dp_patient_card_top">
                    <div class="dp_patient_headline">
                        <span class="dp_patient_avatar dp_patient_avatar_lg" id="patientAvatar">SC</span>
                        <div>
                            <h1 id="patientName">Sarah Chen</h1>
                            <p class="dp_mrn" id="patientMrn">MRN-004821</p>
                        </div>
                    </div>
                    <button class="dp_primary_btn" type="button" id="newRxBtn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        New Prescription
                    </button>
                </div>

                <div class="dp_info_grid">
                    <div>
                        <span class="dp_info_label">Date of Birth</span>
                        <span class="dp_info_value" id="infoDob">Apr 15, 1982 (44 yrs)</span>
                    </div>
                    <div>
                        <span class="dp_info_label">Blood Type</span>
                        <span class="dp_info_value" id="infoBlood">A+</span>
                    </div>
                    <div>
                        <span class="dp_info_label">Last Visit</span>
                        <span class="dp_info_value" id="infoLastVisit">Jul 28, 2026</span>
                    </div>
                    <div>
                        <span class="dp_info_label">Allergies</span>
                        <span class="dp_info_value" id="infoAllergies">Penicillin, Sulfa drugs</span>
                    </div>
                </div>

                <div class="dp_allergy_alert" id="allergyAlert">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span><strong>Allergy alert:</strong> <span id="allergyAlertText">Penicillin, Sulfa drugs</span></span>
                </div>
            </section>

            <section class="dp_prescriptions">
                <div class="dp_prescriptions_header">
                    <h2>Prescriptions</h2>
                    <span class="dp_prescriptions_meta" id="rxMeta">2 active · 2 total</span>
                </div>

                <!-- Prescription cards get generated into here by doctor.js -->
                <div id="rxList"></div>
            </section>

        </main>
    </div>

    <script src="doctor.js"></script>
</body>
</html>
