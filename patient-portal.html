<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Nova — Patient Portal</title>
    <link rel="stylesheet" href="patient_style.css">
</head>
<body>
     <!-- Ye file add krna baki hai!!-->

    <!-- Top bar -->
    <header class="pp_topbar">
        <button class="pp_brand" type="button" id="brandLogoBtn" aria-label="Back to login">
            <img src="care-nova-logo.png" alt="Care Nova">
            <span class="pp_portal_badge">Patient Portal</span>
        </button>

        <div class="pp_profile">
            <div class="pp_profile_text">
                <span class="pp_profile_name">Sarah Chen</span>
                <span class="pp_profile_role">MRN-004821</span>
            </div>
            <div class="pp_avatar">SC</div>
            <button class="pp_logout" type="button" id="logoutBtn" aria-label="Log out">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Secondary navbar: back button + page links -->
    <nav class="pp_navbar" aria-label="Portal navigation">
        <button class="pp_back_btn" type="button" id="backBtn" aria-label="Go back">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back
        </button>

        <div class="pp_nav_links">
            <button class="pp_nav_link" type="button" data-page="Home">Home</button>
            <button class="pp_nav_link" type="button" data-page="Info">Info</button>
            <button class="pp_nav_link" type="button" data-page="Help">Help</button>
        </div>
    </nav>

    <main class="pp_main">

        <!-- Stat cards -->
        <section class="pp_stats" aria-label="Overview">
            <div class="pp_stat_card">
                <div class="pp_stat_top">
                    <span class="pp_stat_label">Active Rx</span>
                    <span class="pp_stat_icon pp_icon_teal">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </span>
                </div>
                <span class="pp_stat_value" id="statActive">2</span>
            </div>

            <div class="pp_stat_card">
                <div class="pp_stat_top">
                    <span class="pp_stat_label">Total Rx</span>
                    <span class="pp_stat_icon pp_icon_sky">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </span>
                </div>
                <span class="pp_stat_value" id="statTotal">4</span>
            </div>

            <div class="pp_stat_card">
                <div class="pp_stat_top">
                    <span class="pp_stat_label">Medications</span>
                    <span class="pp_stat_icon pp_icon_navy">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
                            <line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/>
                        </svg>
                    </span>
                </div>
                <span class="pp_stat_value" id="statMeds">5</span>
            </div>

            <div class="pp_stat_card">
                <div class="pp_stat_top">
                    <span class="pp_stat_label">Blood Type</span>
                    <span class="pp_stat_icon pp_icon_coral">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                        </svg>
                    </span>
                </div>
                <span class="pp_stat_value">A+</span>
            </div>
        </section>

        <!-- Allergy alert -->
        <div class="pp_allergy_alert">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>
                <strong>Known Drug Allergies</strong>
                <span class="pp_allergy_list">Penicillin · Sulfa drugs</span>
            </span>
        </div>

        <!-- Prescriptions -->
        <section class="pp_prescriptions">
            <div class="pp_prescriptions_header">
                <h2>Prescriptions</h2>
                <div class="pp_filter_tabs" id="filterTabs">
                    <button class="pp_filter_tab is_active" type="button" data-filter="all">All</button>
                    <button class="pp_filter_tab" type="button" data-filter="active">Active</button>
                    <button class="pp_filter_tab" type="button" data-filter="expired">Expired</button>
                    <button class="pp_filter_tab" type="button" data-filter="pending">Pending</button>
                </div>
            </div>

            <!-- Prescription cards get generated into here by patient.js -->
            <div id="rxList"></div>
        </section>

    </main>

    <script src="patient.js"></script>
</body>
</html>
